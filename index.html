<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pan Ema · Pan casero</title>
<style>
:root{--bg:#fbf8f2;--ink:#1b1209;--sign:#ff7a00;--card:#fff;--line:#e6dccb;--mute:#6b5a46;--ok:#1f7a3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110b;--ink:#f6ece0;--card:#241a11;--line:#3b2d1f;--mute:#c4b29c}}
:root[data-theme="dark"]{--bg:#17110b;--ink:#f6ece0;--card:#241a11;--line:#3b2d1f;--mute:#c4b29c}
*{box-sizing:border-box}html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:280px}
header{background:var(--sign);color:#000;padding:22px 18px 20px}
h1{margin:0;font:900 clamp(34px,10vw,52px)/1 "Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em}
header p{margin:8px 0 0;font-weight:600;max-width:34ch}
main{max-width:640px;margin:0 auto;padding:14px 14px 0}
.item{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.item img{width:96px;height:96px;object-fit:cover;border-radius:8px}
h2{margin:0;font-size:18px}.d{margin:2px 0 6px;color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:800;font-size:18px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.step span{min-width:22px;text-align:center;font-weight:800}
button:focus-visible,input:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--sign);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:640px;margin:0 auto}
.bar input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
.go{width:100%;padding:13px;border:0;border-radius:10px;background:var(--sign);color:#000;font:800 17px system-ui,sans-serif;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.msg{margin:0 0 6px;font-size:14px;color:var(--mute)}.panel{max-width:640px;margin:0 auto 12px;padding:0 14px}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.box h3{margin:0 0 8px;font:900 18px "Arial Black","Helvetica Neue",Arial,sans-serif}.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:8px 0}.dots i{aspect-ratio:1;border:2px solid var(--ink);border-radius:50%}.dots i.on{background:var(--sign);border-color:var(--sign)}.acts{display:grid;gap:8px;margin-top:8px}.alt{padding:11px;border:2px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);font:700 15px system-ui,sans-serif;cursor:pointer}.box input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.gate{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}.gate[hidden]{display:none}.gate .in{max-width:420px;margin:0 auto}.gate label{display:block;font-weight:700;margin:12px 0 4px}.gate .chk{display:flex;gap:10px;align-items:center;margin-top:16px}.gate .chk input{width:22px;height:22px;flex:none}.fld{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}.lnk{background:none;border:0;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.seg button{padding:10px;border:2px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);font:700 15px system-ui,sans-serif;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
</style></head><body>
<div class="gate" id="gate" hidden><div class="in"><h2>Antes de pedir</h2><p class="d">Déjanos tus datos para llevarte los pedidos. Se guardan en tu celular y se envían a Pan Ema solo cuando haces un pedido.</p><label for="gn">Nombre y apellido</label><input class="fld" id="gn" autocomplete="name"><label for="gw">WhatsApp</label><input class="fld" id="gw" type="tel" inputmode="tel" placeholder="+56 9 1234 5678" autocomplete="tel"><label for="ga">Dirección</label><input class="fld" id="ga" autocomplete="street-address"><label class="chk"><input type="checkbox" id="gv"> Quiero que me avisen por WhatsApp cuando salga pan caliente</label><p class="d" id="gerr" role="alert"></p><button class="go" id="gok">Entrar</button></div></div><header><h1>PAN EMA</h1><p>Pancito casero, puro sabor chileno. Recetas de la abuela.</p></header>
